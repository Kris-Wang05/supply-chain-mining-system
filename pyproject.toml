[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-mining"
version = "0.1.0"
description = "Research workflow for supply chain mining and ticker screening."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Kris-Wang05" }]

[project.scripts]
supply-chain-mining = "supply_chain_mining.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

